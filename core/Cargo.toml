[package]
name = "brass-core"
version = "0.3.0"
edition = "2021"
description = "Deterministic battlefield simulation for Brass Meridian"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.test]
opt-level = 2
